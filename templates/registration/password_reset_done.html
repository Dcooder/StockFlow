{% extends 'base.html' %}

{% block title %}Check your inbox | StockFlow{% endblock %}

{% block content %}
<div class="login-page"><section class="login-panel"><div class="auth-card">
    <p class="eyebrow">CHECK YOUR INBOX</p>
    <h1>Reset link sent</h1>
    <p class="muted">If an account exists for that email, a password-reset link is on its way. The link will expire for your security.</p>
    <p class="muted"><a class="table-action" href="{% url 'login' %}">Return to sign in</a></p>
</div></section></div>
{% endblock %}
